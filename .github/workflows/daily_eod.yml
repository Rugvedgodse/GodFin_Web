name: NSE Daily EOD Closing Prices

on:
  schedule:
    - cron: "0 12 * * 1-5"

  workflow_dispatch:
    inputs:
      trade_date:
        description: "Optional NSE trading date for testing (YYYY-MM-DD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nse-daily-eod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch-and-publish:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      NSE_TRADE_DATE: ${{ github.event.inputs.trade_date || '' }}

    steps:

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch and process NSE bhavcopy
        run: python scripts/fetch_closing_prices.py

      - name: Commit generated data
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/ public/)" ]]; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ public/

          git commit -m "data: update NSE EOD prices"

          git push origin "HEAD:${GITHUB_REF_NAME}"
